# Conecta-Senac - stack de desenvolvimento.
#
# FONTE DA VERDADE UNICA: o backend Spring Boot em `backend/demo/`
# (Postgres/Supabase). O frontend web (embalado na mesma imagem) e o mobile
# falam com ele.
#
# Uso:
#   1. cp .env.example .env     (preencha as senhas)
#   2. docker compose up -d --build
#   3. abra http://localhost:${API_PORT:-8081}
#
# Para subir o MOCK legado (servidor Node em server/, porta 3333, que grava
# em server/data/db.json) em vez da API real:
#
#   docker compose --profile mock up -d server
#
# IMPORTANTE: mock e API nao devem rodar ao mesmo tempo sobre o mesmo
# dispositivo/aplicativo. Eles mantem bases separadas (JSON x Postgres) e
# uma sincronizacao entre as duas corrompe os dados. O perfil `mock` existe
# para desenvolvimento offline, sem Docker e sem JDK.
#
# A senha do Postgres NAO fica escrita neste arquivo: vem do .env
# (veja .env.example). `docker compose config` mostra o valor resolvido -
# nunca comite esse arquivo.
services:
  postgres:
    image: postgres:16
    container_name: conectasenac-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # ":?" = o Compose ABORTA na hora de subir, com esta mensagem, se a
      # variavel faltar ou estiver vazia. Sem isso o Postgres subia com uma
      # senha qualquer e a API ficava em crash loop com um stack trace de
      # Hibernate, sem apontar a causa real.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD e obrigatorio - copie .env.example para .env e defina uma senha forte}
      POSTGRES_DB: ${POSTGRES_DB:-conectasenac}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-conectasenac}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # API Spring Boot + frontend web empacotado na mesma imagem.
  # O build usa o Dockerfile da RAIZ (contexto = "."), que le backend/demo/ e
  # web/ pelos caminhos curtos.
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # "same-origin" = o proprio Spring serve a SPA em / e a API em /api.
        # (O valor vazio NAO funciona: o Vite descarta variaveis de ambiente
        # com "" e o import.meta.env gerado viraria {}.)
        # Use http://host:3333 para falar com o mock legado.
        VITE_API_BASE: ${VITE_API_BASE:-same-origin}
    image: conectasenac:latest
    container_name: conectasenac-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8081
      # A API desta stack fala com o Postgres LOCAL, entao precisa das MESMAS
      # credenciais do servico "postgres" acima. Por isso o par de variaveis e
      # POSTGRES_*, e nao SUPABASE_DB_*.
      #
      # SUPABASE_DB_USER / SUPABASE_DB_PASSWORD existem para rodar o backend
      # FORA do Compose, apontando ao Supabase real - e sao as variaveis lidas
      # por backend/demo/src/main/resources/application.properties. Aqui elas
      # sao preenchidas com o usuario/senha do Postgres local para que o
      # application.properties NAO precise ser alterado.
      SUPABASE_DB_USER: ${POSTGRES_USER:-postgres}
      SUPABASE_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD e obrigatorio - copie .env.example para .env e defina uma senha forte}
      # Sobrescreve o host do application.properties para apontar ao Postgres
      # local desta stack. Em producao, remova esta linha e o .env para que o
      # backend use o pooler do Supabase configurado no proprio projeto.
      SPRING_DATASOURCE_URL: >-
        jdbc:postgresql://postgres:5432/${POSTGRES_DB:-conectasenac}?sslmode=disable
    # A guarda de credencial (senha ainda com o valor de exemplo do
    # .env.example) fica no ENTRYPOINT do Dockerfile - assim ela vale tanto
    # para "docker compose up" quanto para "docker run" da imagem avulsa.
    ports:
      - '${API_PORT:-8081}:8081'
    restart: unless-stopped

  # MOCK LEGADO - servidor Node de dados (server/data/db.json).
  # NAO e a fonte da verdade: existe para desenvolvimento offline.
  # Sobe apenas com o perfil "mock":
  #   docker compose --profile mock up -d server
  # Nao ha imagem: roda direto do fonte, sem build.
  server:
    image: node:20-alpine
    container_name: conectasenac-server
    profiles: ['mock']
    working_dir: /srv
    command: ['node', 'server/index.js']
    environment:
      PORT: '3333'
    volumes:
      # Codigo somente leitura...
      - ./server:/srv/server:ro
      # ...e data/ reescrevivel, porque o servidor persiste db.json de forma
      # atomica (escreve tmp + rename). A montagem seguinte sobrepoe a anterior.
      - ./server/data:/srv/server/data
    ports:
      - '${SERVER_PORT:-3333}:3333'
    restart: unless-stopped

volumes:
  pg_data:
