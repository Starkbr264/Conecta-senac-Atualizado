# =============================================================================
#  Render Blueprint - Conecta-Senac
#
#  Sobe a API Spring Boot (que tambem serve o frontend) a partir do Dockerfile
#  multi-stage da raiz do repositorio.
#
#  O banco NAO e criado aqui: a fonte da verdade e o Postgres do Supabase
#  (veja docs/DEPLOY.md, secao 2). As variaveis de datasource sao digitadas
#  em "sync: false" e preenchidas no painel do Render.
#
#  Uso:
#    1. conecte este repositorio no Render como "Blueprint"
#    2. o Render detecta este arquivo e lista os servicos
#    3. preencha as 3 variaveis marcadas como secret
# =============================================================================

services:
  - type: web
    name: conectasenac-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/dados
    envVars:
      # NAO defina "PORT" aqui.
      #
      # O Render injeta a propria variavel PORT (o log mostra "Tomcat
      # initialized with port 10000"), e o application.properties faz
      # server.port=${PORT:8081}. Fixar 8081 no blueprint cria ambiguidade:
      # se o valor do blueprint prevalecesse, o Render nao acharia a porta e
      # o deploy terminaria com "No open ports detected".

      # --- Segredos: preencha no painel do Render -------------------------
      # Usuario do Postgres (Supabase). No pooler transacional (porta 5432)
      # o usuario tem o formato "postgres.<ref-do-projeto>".
      - key: SUPABASE_DB_USER
        sync: false

      # Senha do Postgres (Supabase).
      - key: SUPABASE_DB_PASSWORD
        sync: false

      # URL JDBC do Postgres. No Supabase use o "pooler" (transacional) para
      # economizar conexoes:
      #   jdbc:postgresql://aws-0-<regiao>.pooler.supabase.com:5432/postgres?sslmode=require
      #
      # ATENCAO 1 - o prefixo "jdbc:" e OBRIGATORIO. A URI mostrada no painel
      # do Supabase vem como "postgresql://..." e o driver do PostgreSQL
      # REJEITA esse formato, derrubando o boot com:
      #   "Driver org.postgresql.Driver claims to not accept jdbcUrl, postgresql://..."
      #
      # ATENCAO 2 - NAO coloque "usuario:senha@" antes do host. O pgjdbc nao
      # faz parse de "userinfo": ele trata o bloco inteiro como parte do
      # hostname e o boot morre com:
      #   "java.net.UnknownHostException: postgres.<REF>:<SENHA>@aws-0-<regiao>.pooler.supabase.com"
      # A credencial vai em SUPABASE_DB_USER / SUPABASE_DB_PASSWORD, que o
      # Spring Boot entrega ao driver como Properties (formato esperado pelo
      # pgjdbc). Por isso a senha NAO precisa de URL-encode.
      - key: SPRING_DATASOURCE_URL
        sync: false

      # O frontend (injetado no jar) fala com a API na MESMA origem do
      # container, entao "same-origin" e o valor correto aqui. O token
      # "same-origin" existe porque o Vite descarta variaveis de ambiente
      # vazias - nunca use string vazia.
      - key: VITE_API_BASE
        value: same-origin

      # --- Segredo de autenticacao JWT (OBRIGATORIO) -----------------------
      # Chave de assinatura dos tokens JWT (HS256). Deve ter pelo menos 32
      # caracteres. Gere com: openssl rand -base64 32
      # NUNCA reutilize a mesma chave em ambientes diferentes.
      - key: JWT_SECRET
        sync: false

      # Validade do token JWT em milissegundos (padrao: 24 horas).
      - key: JWT_EXPIRATION_MS
        value: "86400000"
