name: Integracao PostgreSQL - identidade e sincronizacao

on:
  push:
    branches:
      - feat/evoluir-solicitacoes
  pull_request:
    branches:
      - main-Versão-4.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-postgres:
    name: Identidade HTTP com PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/demo
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: conecta_ci
          POSTGRES_USER: conecta_ci
          POSTGRES_PASSWORD: conecta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U conecta_ci -d conecta_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      JWT_SECRET: ci-only-secret-key-with-at-least-32-characters
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/conecta_ci?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Garantir execucao do wrapper
        run: chmod +x ./gradlew

      - name: Integracao HTTP no PostgreSQL
        run: >
          ./gradlew test --no-daemon --console=plain
          --tests conecta.demo.SecurityIdentityPostgresIntegrationTest
          --tests conecta.demo.FlywayMigrationIsolatedTest

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-identidade-postgresql
          path: |
            backend/demo/build/test-results/test/**
            backend/demo/build/reports/tests/test/**
          if-no-files-found: warn
