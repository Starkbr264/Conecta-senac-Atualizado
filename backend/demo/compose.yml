# Backend Spring Boot — Postgres local para testes e desenvolvimento.
#
#   docker compose -f backend/demo/compose.yml up -d --build
#   docker compose -f backend/demo/compose.yml exec api ./gradlew test --no-daemon
#
# A senha do Postgres NAO fica escrita neste arquivo: vem do .env (veja
# .env.example na raiz do repositorio). `docker compose config` mostra o valor
# resolvido — nunca comite esse arquivo.
services:
  postgres:
    image: postgres:16
    container_name: conecta-test-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-conecta_test}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pg_test:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-conecta_test}
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    image: conecta-api:latest
    container_name: conecta-test-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8081
      SUPABASE_DB_USER: ${POSTGRES_USER:-postgres}
      SUPABASE_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Sobrescreve o host do application.properties para apontar ao Postgres
      # local desta stack. Em producao, remova esta linha e o .env para que o
      # backend use o pooler do Supabase configurado no proprio projeto.
      SPRING_DATASOURCE_URL: >-
        jdbc:postgresql://postgres:5432/${POSTGRES_DB:-conecta_test}?sslmode=disable
    ports:
      - '${API_PORT:-8081}:8081'
    restart: unless-stopped

volumes:
  pg_test:
