spring.docker.compose.enabled=false

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
# URL JDBC do Postgres.
#
# OBRIGATORIA em ambiente hospedado (Render/producao): defina a variavel de
# ambiente SPRING_DATASOURCE_URL. O padrao abaixo e o Postgres local do
# compose.yaml (servico "postgres" na porta 5432).
#
# Formato OBRIGATORIO do driver PostgreSQL:
#   jdbc:postgresql://<usuario>:<senha>@<host>:<porta>/<banco>?sslmode=require
#
# ATENCAO: a URI que o Supabase mostra no painel e' "postgresql://..." (sem
# o prefixo "jdbc:") e o driver REJEITA esse formato:
#   "Driver org.postgresql.Driver claims to not accept jdbcUrl, postgresql://..."
# Se a senha tiver caracteres especiais (@ / : ? # &) ela precisa estar
# URL-encoded dentro da URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/conectasenac?sslmode=disable}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8081}