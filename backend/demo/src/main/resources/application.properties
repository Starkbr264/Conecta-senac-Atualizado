spring.docker.compose.enabled=false

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
# URL JDBC do Postgres.
#
# OBRIGATORIA em ambiente hospedado (Render/producao): defina a variavel de
# ambiente SPRING_DATASOURCE_URL. O padrao abaixo e o Postgres local do
# compose.yaml (servico "postgres" na porta 5432).
#
# Formato OBRIGATORIO do driver PostgreSQL (pgjdbc):
#   jdbc:postgresql://<host>:<porta>/<banco>?sslmode=require
#
# ATENCAO 1: a URI que o Supabase mostra no painel e' "postgresql://..." (sem
# o prefixo "jdbc:") e o driver REJEITA esse formato:
#   "Driver org.postgresql.Driver claims to not accept jdbcUrl, postgresql://..."
#
# ATENCAO 2: NAO coloque "usuario:senha@" antes do host. O pgjdbc nao faz
# parse de "userinfo" - ele trata o bloco inteiro como parte do hostname e o
# boot morre com:
#   "java.net.UnknownHostException: postgres.<REF>:<SENHA>@host"
# O usuario e a senha vao em spring.datasource.username / spring.datasource.password
# (SUPABASE_DB_USER / SUPABASE_DB_PASSWORD), que o Spring Boot entrega ao
# driver como Properties - esse e o formato que o pgjdbc espera.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/conectasenac?sslmode=disable}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8081}